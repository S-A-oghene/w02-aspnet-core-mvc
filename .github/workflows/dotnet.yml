name: Build ASP.NET Core MVC application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore EseogheneMovies/EseogheneMovies.csproj
      - name: Build application
        run: dotnet build EseogheneMovies/EseogheneMovies.csproj --no-restore --configuration Release
